id: no-legacy-liquid-glass-imports-ts
language: TypeScript
severity: error
message: "Legacy liquidGlass module was removed. Import from 'components/LiquidGlassWrapper' instead."
rule:
  all:
    - kind: string
    - regex: "^['\"](?:\\.\\./)+components/liquidGlass(?:/[^'\"]*)?['\"]$"
    - inside:
        kind: import_statement
