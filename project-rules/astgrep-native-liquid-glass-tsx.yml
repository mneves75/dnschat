id: no-native-liquid-glass-module-tsx
language: Tsx
severity: error
message: "Do not reference deleted ios/LiquidGlassNative modules."
rule:
  any:
    - all:
        - kind: identifier
        - regex: "^LiquidGlassNative$"
    - all:
        - kind: string
        - regex: "^['\"]LiquidGlassNative['\"]$"
