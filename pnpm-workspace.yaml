packages:
  - '.'
  - 'modules/dns-native'
  - 'marketing/video'

# NOTE ON SUPPLY-CHAIN POLICIES (react-doctor suggests minimumReleaseAge +
# trustPolicy here). Since pnpm v11, minimumReleaseAge defaults to 1440 (1 day)
# and is ACTIVE unless `minimumReleaseAge: 0` is set — not a repo decision.
# The Excludes below are the required-package overrides for the Expo SDK 57
# patch set that expo-doctor mandates; the versions were published within the
# 24h window, so they are excluded rather than weakening the policy (see
# AGENTS.md). `blockExoticSubdeps`, `strictDepBuilds` stay on default.
# trustPolicy: no-downgrade — flags semver@6.3.1 and ua-parser-js@1.0.41 as
# trust downgrades. Both are long-stable releases that predate npm
# provenance attestations and are pinned upstream (fbjs -> react-native-web),
# so they are not ours to move.
#
# Revisit the Excludes once these versions have aged past the 1-day window.

# React Native/Expo compatibility fallback.
nodeLinker: hoisted
enableGlobalVirtualStore: false
allowBuilds:
  '@ast-grep/cli': true
  esbuild: true

# Security version floors (formerly npm-style "overrides" in package.json,
# which pnpm ignores — they must live here to apply).
overrides:
  # GHSA-6gmq-8vp8-gcm6 (XML fragment injection) hits <=0.8.14 and 0.9.0-0.9.11,
  # so both floors move together: unscoped resolves to the patched 0.9 line for
  # plist@3, and the scoped entry below stays on the patched 0.8 line.
  '@xmldom/xmldom': '>=0.8.15'
  # ...but @expo/plist@0.8.1 declares `^0.8.8` and calls
  # `parseFromString(xml)` with no mimeType. xmldom 0.9 made that a hard error,
  # so the unscoped floor above crashed `expo run:ios` (`pnpm run ios`) with
  # `the provided mimeType "undefined" is not valid` as soon as the CLI probed
  # usbmux. Keep @expo/plist on the patched 0.8 line; `plist@3` genuinely wants
  # ^0.9.10 and stays there.
  '@expo/plist>@xmldom/xmldom': '~0.8.15'
  # plist@3 pins an exact 0.9.10, which the unscoped floor above does not
  # rewrite. It genuinely wants the 0.9 line, so move it to the patched 0.9.12
  # rather than dragging it back to 0.8.
  'plist>@xmldom/xmldom': '>=0.9.12'
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g. Caret floor: every consumer wants 4.x.
  browserslist: '^4.28.7'
  brace-expansion: '>=5.0.9'
  handlebars: '>=4.7.9'
  js-yaml: '>=4.3.0'
  markdown-it: '>=12.3.2'
  # GHSA-2v37-7h3g-55p8. Caret-pinned, not '>=': every consumer here
  # (expo-router, postcss) wants nanoid ^3, and '>=' would resolve to 6.x.
  nanoid: '^3.3.18'
  node-forge: '>=1.4.0'
  postcss: '>=8.5.18'
  shell-quote: '>=1.8.5'
  uuid: '>=11.1.1'
  ws: '>=8.21.0'
  yaml: '>=2.8.3'

# Time-boxed audit suppressions. Each entry needs a published-fix blocker and a
# recheck date; delete the entry (and bump the floor) the moment a fix ships.
#
# image-size GHSA-w3rx-r6r6-pgpr (ICNS parser infinite loop) and
# GHSA-5p2g-fcmc-qvqq (JXL/HEIF parser infinite loops), both high.
# Blocker: the advisories declare `patched >=2.0.3`, and no 2.0.3 exists on npm
# (newest is 2.0.2, and the whole 1.x line carries the `legacy` tag). There is
# no version to move to. image-size reaches this repo only as a Metro
# dependency used at bundle time to read the dimensions of assets already in
# this repository; it is not linked into the iOS or Android binary and never
# parses network input. Recheck 2026-09-12.
#
# decode-uri-component GHSA-vcc3-ghjq-m6fr / CVE-2026-45822 (CWE-400
# algorithmic-complexity DoS, CVSS 6.6 moderate), reached only through
# query-string -> expo-router.
# Blocker: the sole patched release is 0.5.0, which is ESM-only ("type":
# "module", and its `exports` map has no `require` condition), while
# query-string require()s it from the Metro CJS bundle. Every 0.2/0.3/0.4
# release is inside the vulnerable range, so there is no CJS version to move
# to; forcing 0.5.0 would break the app bundle at runtime to fix a hang that
# needs the user to open a hostile deep link. Drop this entry when expo-router
# ships a query-string depending on a CJS-compatible fixed release.
# Recheck 2026-10-01.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-vcc3-ghjq-m6fr

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12 || 57.0.21 || 57.0.22'
  - '@expo/router-server@57.0.5 || 57.0.9'
  - expo-constants@57.0.9 || 57.0.17
  - expo-modules-core@57.0.9 || 57.0.15 || 57.0.16
  - expo@57.0.10 || 57.0.19 || 57.0.20
  - '@expo/ui@57.0.9 || 57.0.15 || 57.0.16'
  - expo-linking@57.0.5 || 57.0.9
  - expo-router@57.0.10 || 57.0.18 || 57.0.19
  - '@expo/fingerprint@0.20.12'
  - '@expo/metro-runtime@57.0.15'
  - babel-preset-expo@57.0.10
  - expo-asset@57.0.16
  - expo-build-properties@57.0.16 || 57.0.17
  - expo-font@57.0.3
  - expo-modules-jsi@57.0.7 || 57.0.8
  - expo-secure-store@57.0.3
