packages:
  - '.'

# NOTE ON SUPPLY-CHAIN POLICIES (react-doctor suggests minimumReleaseAge +
# trustPolicy here). Both were evaluated on 2026-07-28 and deliberately NOT
# enabled, because each currently rejects the committed lockfile outright and
# would fail CI's `pnpm install --frozen-lockfile`:
#
#   minimumReleaseAge — the security floors below (brace-expansion 5.0.8,
#     js-yaml, postcss) and the Expo SDK 57 patch set that expo-doctor requires
#     are all younger than the suggested 7-day window. The policy would reject
#     the very versions the security floors exist to force.
#   trustPolicy: no-downgrade — flags semver@6.3.1 and ua-parser-js@1.0.41 as
#     trust downgrades. Both are long-stable releases that predate npm
#     provenance attestations and are pinned upstream (fbjs -> react-native-web),
#     so they are not ours to move.
#
# Revisit once the pinned Expo/security versions have aged past the window.

# React Native/Expo compatibility fallback.
nodeLinker: hoisted
enableGlobalVirtualStore: false
allowBuilds:
  '@ast-grep/cli': true

# Security version floors (formerly npm-style "overrides" in package.json,
# which pnpm ignores — they must live here to apply).
overrides:
  '@xmldom/xmldom': '>=0.8.13'
  brace-expansion: '>=5.0.9'
  handlebars: '>=4.7.9'
  js-yaml: '>=4.3.0'
  markdown-it: '>=12.3.2'
  node-forge: '>=1.4.0'
  postcss: '>=8.5.18'
  shell-quote: '>=1.8.5'
  uuid: '>=11.1.1'
  ws: '>=8.21.0'
  yaml: '>=2.8.3'
